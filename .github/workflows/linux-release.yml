name: Linux Release

# A manual or test release of vxbeamer-linux: push a tag `linux-vX.Y.Z`, or
# `linux-vX.Y.Z-test.N` for a prerelease that `mise` never picks unless asked
# for by exact version. Regular releases come from the Publish workflow,
# alongside the changesets release.

on:
  push:
    tags: ["linux-v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#linux-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG does not name a semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    uses: ./.github/workflows/reusable-linux-release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.version.outputs.version }}
