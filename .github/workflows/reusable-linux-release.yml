name: Reusable Linux Release

# Builds static vxbeamer-linux binaries, publishes them as their own GitHub
# release tagged `linux-v<version>`, and signs them with packslip so that
# `mise use packslip:github.com/dtinth/vxbeamer/apps/linux` can install them.
#
# Why a separate tag: packslip finds a monorepo tool's versions from tags
# prefixed with the tool's subpath, its last segment or the repository name.
# The changesets tag (`vxasr@X.Y.Z`) names none of those, so a binary attached
# to it would be invisible to `mise`. The release is never marked "Latest", so
# the repository's latest release stays the main one; packslip consumers then
# fall back to the highest `linux-v*` version.

on:
  workflow_call:
    inputs:
      version:
        description: Semver version without a leading v, e.g. 1.2.3 or 1.2.3-test.1
        type: string
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - uses: actions/checkout@v6

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Stamp the version
        env:
          VERSION: ${{ inputs.version }}
        run: sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        env:
          NAME: vxbeamer-linux-${{ inputs.version }}-${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/vxbeamer-linux"
          file "$binary"
          "$binary" --version | grep -Fx "vxbeamer-linux $VERSION"
          mkdir -p "dist/$NAME"
          cp "$binary" vxbeamer-linux.desktop README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ matrix.platform }}
          path: apps/linux/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release and upload to it.
      id-token: write # Sign with the workflow's identity.
      attestations: write # Attest the archives.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: linux-v${{ inputs.version }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          path: dist
          pattern: linux-release-*
          merge-multiple: true

      - name: Create the GitHub release
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "vxbeamer-linux $VERSION" \
            --notes "Static Linux binaries of vxbeamer-linux $VERSION. Install with: \`mise use -g packslip:github.com/$GITHUB_REPOSITORY/apps/linux@$VERSION\`. See apps/linux/README.md." \
            --latest=false \
            "${prerelease[@]}"

      - name: Sign with packslip
        uses: jdx/packslip@v1
        with:
          project: github.com/${{ github.repository }}/apps/linux
          version: ${{ inputs.version }}
          tag: linux-v${{ inputs.version }}
          artifacts: dist/*.tar.gz
          bin: vxbeamer-linux
