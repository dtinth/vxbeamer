[package]
name = "vxbeamer-linux"
version = "0.1.0"
description = "vxbeamer for the Linux desktop: toggle transcription from a global shortcut, transcript to the clipboard"
license = "MIT"
publish = false
edition = "2024"

[dependencies]
base64 = "0.22"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
strip = true
lto = true
